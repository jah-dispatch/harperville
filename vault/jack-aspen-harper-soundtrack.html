<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harperville Resorts | The Soundtrack</title>
    <!-- Hooked to the Casino Theme -->
    <link rel="stylesheet" href="../harperville-casino.css">
</head>
<body class="main-body">
    
    <!-- Navigation Header -->
    <header class="glass-panel nav-header">
        <a href="../splash.html">
            <img src="../jack-aspen-harper-icon.png" alt="Jack Aspen Harper" class="nav-icon">
        </a>
        <nav class="hidden-menu">
            <a href="../about.html" class="nav-tab">Jack Harper</a>
            <a href="index.html" class="nav-tab">The Vault</a>
        </nav>
    </header>

    <main class="content-area">

        <!-- BACK TO SPLASH BUTTON -->
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="../splash.html" class="nav-tab">&lt; BACK TO SPLASH</a>
        </div>

        <h1 class="hero-title" style="margin-top: 0; font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 15px;">The Soundtrack</h1>
        
        <div class="resort-card" style="text-align: center; padding: 15px; border-top: 3px solid var(--tiger-orange); margin-bottom: 25px;">
            <p style="margin: 0; font-family: var(--font-heading); font-size: 1rem; color: var(--tiger-orange); letter-spacing: 1.5px; text-transform: uppercase;">The Life of Jack Aspen Harper</p>
            <p style="margin: 5px 0 0 0; font-size: 0.9rem; color: var(--text-muted);">A sonic breakdown of the journey, the grind, and the unyielding willpower.</p>
        </div>

        <!-- THE APPLE MUSIC CONTAINER -->
        <div class="resort-card" style="padding: 12px; border: 1px solid var(--tiger-orange); box-shadow: 0 8px 32px rgba(221, 125, 22, 0.15); max-width: 700px; margin: 0 auto;">
            <!-- Explicitly wrapping the iframe to guarantee clean mobile scaling inside the phone frame -->
            <div style="border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.8); line-height: 0;">
                <iframe allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" 
                        frameborder="0" 
                        height="450" 
                        style="width:100%; overflow:hidden; border-radius:10px; opacity: 0.9; transition: opacity 0.3s ease; background: #000;" 
                        sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" 
                        src="https://embed.music.apple.com/us/playlist/the-life-of-jack-aspen-harper/pl.u-JPAZbdZFLrLrJb2"
                        onmouseover="this.style.opacity='1'" 
                        onmouseout="this.style.opacity='0.9'">
                </iframe>
            </div>
        </div>

        <p style="text-align: center; font-size: 0.85rem; color: var(--gold-trim); font-style: italic; margin-top: 25px; letter-spacing: 1px;">
            *Queue up the tracklist, filter out the background noise, and lock into the zone.*
        </p>
        
        <div style="height: 50px;"></div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel main-footer">
        <img src="../jack-aspen-harper-icon.png" alt="Jack Aspen Harper" class="footer-logo">
        <p>&copy; 2026 Harperville Resorts</p>
        <p class="footer-subtext">Jack Aspen Harper</p>
    </footer>

</body>
</html>
