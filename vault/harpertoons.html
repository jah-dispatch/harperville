<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harperville | Harpertoons</title>
    <!-- Hooked to the master autumn stylesheet -->
    <link rel="stylesheet" href="../harperville-casino.css">

    <!-- PAGE-SPECIFIC OVERRIDES & FIXED BACKGROUND -->
    <style>
        /* Fixed Background Slideshow Container */
        .fixed-bg-window {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; background-color: var(--casino-black);
        }
        
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        /* Grayscale & resize the footer logo */
        .main-footer .footer-logo {
            width: 45px !important; height: 45px !important;
            filter: grayscale(100%) !important; opacity: 0.35 !important;
            margin-bottom: 15px; transition: opacity 0.3s ease;
        }
        
        .main-footer .footer-logo:hover { opacity: 0.8 !important; }

        /* Enforce Rouge Script and protect it from Uppercase/Spacing rules */
        .hero-title, h1, h2, h3, h4, h5, h6 {
            font-family: 'Rubik Dirt', cursive !important;
            text-transform: none !important;
            letter-spacing: normal !important;
        }

        /* Center the pagination container */
        .pagination-glass {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 40px auto;
            flex-wrap: wrap;
        }

        /* Geometric Autumn Leaf Buttons */
        .leaf-btn {
            background: rgba(28, 18, 12, 0.85);
            border: 2px solid var(--tiger-orange);
            color: var(--text-primary);
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            width: 45px;
            height: 45px;
            border-radius: 0 50% 50% 50%; /* Creates the leaf shape */
            transform: rotate(45deg); 
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
        }

        /* Counter-rotate the text inside so the numbers sit upright */
        .leaf-btn span {
            transform: rotate(-45deg);
            display: block;
        }

        .leaf-btn:hover:not(:disabled) {
            background: var(--tiger-orange);
            color: var(--casino-black);
            box-shadow: 0 0 20px rgba(200, 109, 42, 0.6);
            transform: rotate(45deg) scale(1.1);
        }

        .leaf-btn.active {
            background: var(--tiger-orange);
            color: var(--casino-black);
            border-color: var(--gold-trim);
            box-shadow: 0 0 15px rgba(229, 169, 60, 0.5);
        }

        .leaf-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--text-muted);
        }

        /* Dark acrylic category tags for dynamically generated content */
        .category-tag {
            display: inline-block;
            background: rgba(28, 18, 12, 0.85); 
            font-family: 'Short Stack', cursive !important;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 20px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Comic Lightbox Override */
        .modal-overlay img {
            border: 2px solid var(--tiger-orange) !important;
        }
    </style>
</head>
<body class="main-body">

    <!-- FIXED BACKGROUND LAYERS (Dual-layer for smooth crossfading) -->
    <div class="fixed-bg-window">
        <div id="bg-back" class="bg-layer" style="background-image: url('../assets/ui/backgrounds/and-a-bag-of-chips.png');"></div>
        <div id="bg-front" class="bg-layer" style="background-image: url('../assets/ui/backgrounds/sands-of-time-2.png'); opacity: 0; transition: opacity 2.5s ease-in-out;"></div>
    </div>
    
    <!-- EMOJI PARTICLE CONTAINER -->
    <div id="leaf-container"></div>

    <!-- Navigation Header -->
    <header class="glass-panel nav-header">
        <a href="../splash.html">
            <img src="../jack-aspen-harper-icon.png" alt="Jack Aspen Harper" class="nav-icon">
        </a>
        <nav class="hidden-menu">
            <a href="../about.html" class="nav-tab">Jack Harper</a>
            <a href="index.html" class="nav-tab">The Vault</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content-area">
        
        <!-- BACK TO SPLASH BUTTON -->
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="../splash.html" class="nav-tab">&lt; BACK TO HOME</a>
        </div>

        <h1 class="hero-title" style="margin-top: 0; font-size: clamp(3rem, 6vw, 4.5rem); margin-bottom: 15px; text-align: center;">Harpertoons</h1>
        
        <p style="text-align: center; color: var(--text-muted); font-size: 1.1rem; margin-bottom: 35px; font-family: 'Short Stack', cursive;">Daily struggles, feline overlords, and indie-web survival.</p>

        <!-- DYNAMIC COMIC CONTAINER -->
        <div id="comic-container">
            <div class="resort-card" id="loading-state">
                <p style="text-align:center; color: var(--tiger-orange); font-family: 'Short Stack', cursive; font-size: 1.1rem;">Booting up the drawing board...</p>
            </div>
        </div> 

        <!-- PAGINATION CONTROLS -->
        <div id="pagination-controls" class="pagination-glass"></div>

        <div style="height: 30px;"></div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel main-footer">
        <img src="../jack-aspen-harper-icon.png" alt="Jack Aspen Harper" class="footer-logo">
        <p>&copy; 2026 Harperville</p>
        <p class="footer-subtext">Jack Aspen Harper</p>
            </footer>

    <!-- LIGHTBOX MODAL (Hidden by default) -->
    <div id="image-modal" class="modal-overlay">
        <img id="full-size-img" src="" alt="Full Size Comic">
    </div>

    <!-- THE AUTUMN ENGINE JS (Slideshow & Leaves) -->
    <script>
        // --- 1. THE AUTUMN SLIDESHOW ENGINE (Randomized with ../ paths) ---
        const bgImages = [
            '../assets/ui/backgrounds/sands-of-time-2.png',
            '../assets/ui/backgrounds/distance-between-him-2.png',
            '../assets/ui/backgrounds/safe-keeping-1.png',
            '../assets/ui/backgrounds/island-daddy-1.png',
            '../assets/ui/backgrounds/distance-between-him-1.png',
            '../assets/ui/backgrounds/safe-keeping-2.png',
            '../assets/ui/backgrounds/and-a-bag-of-chips.png',
            '../assets/ui/backgrounds/island-daddy-2.png',
            '../assets/ui/backgrounds/sands-of-time-3.png',
            '../assets/ui/backgrounds/sands-of-time-1.png'
        ];

        let currentBgIndex = 0;
        const layerBack = document.getElementById('bg-back');
        const layerFront = document.getElementById('bg-front');
        let isFrontActive = false;

        bgImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        setInterval(() => {
            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
            const nextImage = `url('${bgImages[currentBgIndex]}')`;

            if (isFrontActive) {
                layerBack.style.backgroundImage = nextImage;
                layerFront.style.opacity = '0';
            } else {
                layerFront.style.backgroundImage = nextImage;
                layerFront.style.opacity = '1';
            }
            isFrontActive = !isFrontActive;
            
        }, 14000); 

        // --- 2. EMOJI LEAF ENGINE ---
        const leaves = ['🍂', '🍁', '🤎', '🧡', '🌾']; 
        const containerLeaves = document.getElementById('leaf-container');
        for(let i = 0; i < 20; i++) { 
            let leaf = document.createElement('div');
            leaf.className = 'emoji-leaf';
            leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = (Math.random() * 6 + 6) + 's';
            leaf.style.animationDelay = (Math.random() * 5) + 's';
            leaf.style.fontSize = (Math.random() * 0.8 + 1.2) + 'rem';
            containerLeaves.appendChild(leaf);
        }
    </script>

    <!-- DYNAMIC FIREBASE STREAMING ENGINE -->
    <script type="module">
        import { db } from "/assets/js/firebase-config.js";
        import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const container = document.getElementById("comic-container");
        const paginationControls = document.getElementById("pagination-controls");
        
        // STRICTLY 1 COMIC PER PAGE
        const cardsPerPage = 1; 
        let currentPage = 1;
        let allCards = [];

        const q = query(collection(db, "harpertoons"), orderBy("timestamp", "desc"));
        
        onSnapshot(q, (snapshot) => {
            container.innerHTML = ""; 
            allCards = [];

            if (snapshot.empty) {
                container.innerHTML = `<div class="resort-card"><p style="text-align:center; color: var(--text-muted); font-family: 'Short Stack', cursive;">No comics uploaded yet. Check back soon!</p></div>`;
                paginationControls.innerHTML = "";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement("div");
                card.className = "resort-card"; 
                
                let timeString = "Signal lost";
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    timeString = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }

                const title = data.title || "Untitled";
                const imageUrl = data.imageUrl || "";
                
                // Assemble the comic card layout with new aesthetics
                card.innerHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div class="category-tag" style="border: 1px solid var(--tiger-orange); color: var(--tiger-orange);">${timeString}</div>
                    </div>
                    <h2 style="font-family: 'Rouge Script', cursive; font-size: 3.5rem; color: var(--gold-trim); text-align: center; margin-top: 0; margin-bottom: 25px; text-shadow: 0 2px 4px rgba(0,0,0,0.6);">${title}</h2>
                    <div class="media-wrapper" style="border: 1px solid var(--tiger-orange); border-radius: 8px; overflow: hidden; cursor: zoom-in; box-shadow: 0 8px 30px rgba(0,0,0,0.8); background: #000;">
                        <img src="${imageUrl}" alt="${title}" class="media-image" style="width: 100%; height: auto; display: block;" onclick="openModal('${imageUrl}')">
                    </div>
                    <p style="text-align: center; font-size: 0.95rem; margin-top: 20px; color: var(--tiger-orange); font-family: 'Short Stack', cursive; letter-spacing: 1px;">*Click or tap the comic to view full size*</p>
                `;
                
                allCards.push(card);
                container.appendChild(card);
            });

            displayPage(currentPage);
        });

        function displayPage(page) {
            allCards.forEach(card => {
                card.style.display = "none";
                card.style.animation = "none";
            });
            
            const startIndex = (page - 1) * cardsPerPage;
            const endIndex = startIndex + cardsPerPage;
            
            const activeCards = allCards.slice(startIndex, endIndex);
            activeCards.forEach(card => {
                card.style.display = "block";
                void card.offsetWidth; 
                card.style.animation = "fadeInCard 0.4s ease forwards";
            });
            
            updateButtons(page);
        }

        /* PAGINATION ENGINE WITH LEAF SHAPES */
        function updateButtons(activePage) {
            paginationControls.innerHTML = "";
            const totalPages = Math.ceil(allCards.length / cardsPerPage);
            
            if (totalPages > 1) {
                // The Previous Anchor
                const prevBtn = document.createElement("button");
                prevBtn.innerHTML = "<span>&laquo;</span>"; 
                prevBtn.className = "leaf-btn";
                if (activePage === 1) prevBtn.disabled = true;
                prevBtn.addEventListener("click", () => {
                    if (currentPage > 1) {
                        currentPage--;
                        displayPage(currentPage);
                        document.querySelector("h1").scrollIntoView({ behavior: "smooth" });
                    }
                });
                paginationControls.appendChild(prevBtn);

                let startPage = Math.max(1, activePage - 1);
                let endPage = Math.min(totalPages, activePage + 1);

                if (activePage === 1) endPage = Math.min(totalPages, 3);
                if (activePage === totalPages) startPage = Math.max(1, totalPages - 2);

                for (let i = startPage; i <= endPage; i++) {
                    const btn = document.createElement("button");
                    btn.innerHTML = `<span>${i}</span>`; 
                    btn.className = "leaf-btn";
                    if (i === activePage) btn.classList.add("active");
                    
                    btn.addEventListener("click", () => {
                        currentPage = i;
                        displayPage(currentPage);
                        document.querySelector("h1").scrollIntoView({ behavior: "smooth" });
                    });
                    
                    paginationControls.appendChild(btn);
                }

                // The Next Anchor
                const nextBtn = document.createElement("button");
                nextBtn.innerHTML = "<span>&raquo;</span>"; 
                nextBtn.className = "leaf-btn";
                if (activePage === totalPages) nextBtn.disabled = true;
                nextBtn.addEventListener("click", () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        displayPage(currentPage);
                        document.querySelector("h1").scrollIntoView({ behavior: "smooth" });
                    }
                });
                paginationControls.appendChild(nextBtn);
            }
        }

        // --- LIGHTBOX MODAL LOGIC ---
        const modal = document.getElementById('image-modal');
        const fullImg = document.getElementById('full-size-img');

        // Make openModal available globally so the inline onclick can trigger it
        window.openModal = function(src) {
            fullImg.src = src;
            modal.classList.add('active');
        };

        // Close when clicking anywhere on the dark overlay
        modal.addEventListener('click', () => {
            modal.classList.remove('active');
            setTimeout(() => { fullImg.src = ""; }, 300); // clear image after fade out
        });
    </script>
</body>
</html>
