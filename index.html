<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Pure CSS Caution Tape */
        .caution-tape {
            width: 100%;
            height: 45px;
            background: repeating-linear-gradient(
                -45deg,
                #ffcc00,
                #ffcc00 30px,
                #000000 30px,
                #000000 60px
            );
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        h3 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffcc00;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.25rem;
            color: #cccccc;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Subtle pulse to show the page is active */
        .pulse {
            animation: pulse-opacity 2.5s infinite;
        }

        @keyframes pulse-opacity {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Top Tape -->
    <div class="caution-tape"></div>

    <div class="content-wrapper">
        <h3 class="pulse">Under Construction</h3>
        <p>The site is currently down for a complete redesign. Check back soon!</p>
    </div>

    <!-- Bottom Tape -->
    <div class="caution-tape"></div>
</body>
</html>
