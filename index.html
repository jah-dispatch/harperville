<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack's Sandbox</title>
    <link rel="stylesheet" href="harperville-casino.css">
    <!-- Schema skipped for brevity, leave yours intact! -->
</head>
<body>
    
    <!-- BACKGROUND PARALLAX LAYER -->
    <div class="parallax-window">
        <div class="parallax-layer" style="background-image: url('assets/ui/backgrounds/safe-keeping-1.png');"></div>
    </div>
    
    <!-- EMOJI PARTICLE CONTAINER -->
    <div id="leaf-container"></div>

    <main class="hero-section">
        <!-- Added the layered autumn text shadow inline -->
        <h1 class="hero-title" style="text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(200, 109, 42, 0.6);">Jack's Sandbox</h1>
        
        <div class="card-scene">
            <div class="card-3d-wrapper">
                <div class="card-face card-front"></div>
                <div class="card-face card-back"></div>
            </div>
        </div>
        
        <!-- UPDATED FALL CTA -->
        <button class="btn-reserve" onclick="window.location.href='splash.html';">Sweep me into Harperville 🍂</button>
    </main>

    <!-- THE AUTUMN ENGINE JS -->
    <script>
        // Parallax Scroll Math
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const layer = document.querySelector('.parallax-layer');
            if(layer) layer.style.transform = `translateY(${scrolled * 0.3}px)`; // 0.3 speed ratio
        });

        // Emoji Generator
        const leaves = ['🍂', '🍁', '🤎', '🧡', '🌾'];
        const container = document.getElementById('leaf-container');
        const leafCount = 18; // How heavy the breeze is

        for(let i=0; i < leafCount; i++) {
            let leaf = document.createElement('div');
            leaf.className = 'emoji-leaf';
            leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
            leaf.style.left = Math.random() * 100 + 'vw';
            // Randomize fall speed and delay so they don't drop in a straight line
            leaf.style.animationDuration = (Math.random() * 6 + 6) + 's';
            leaf.style.animationDelay = (Math.random() * 5) + 's';
            // Randomize starting size slightly to create artificial depth
            leaf.style.fontSize = (Math.random() * 0.8 + 1.2) + 'rem';
            container.appendChild(leaf);
        }
    </script>
</body>
</html>
