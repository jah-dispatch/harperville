<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harperville | Autobiography</title>
    <!-- Core Structural Physics - Hooked to Autumn Theme -->
    <link rel="stylesheet" href="../../../harperville-casino.css">
    <!-- Local Reader & Chapter Button Overrides -->
    <link rel="stylesheet" href="autobiography.css">
    
    <!-- ePub.js and JSZip Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <!-- PAGE-SPECIFIC OVERRIDES & FIXED BACKGROUND -->
    <style>
        /* Fixed Background Slideshow Container */
        .fixed-bg-window {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; background-color: var(--casino-black);
        }
        
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        /* Grayscale & resize the footer logo */
        .main-footer .footer-logo {
            width: 45px !important; height: 45px !important;
            filter: grayscale(100%) !important; opacity: 0.35 !important;
            margin-bottom: 15px; transition: opacity 0.3s ease;
        }
        
        .main-footer .footer-logo:hover { opacity: 0.8 !important; }

        /* Enforce Rouge Script and protect it from Uppercase/Spacing rules */
        .hero-title, h1, h2, h3, h4, h5, h6 {
            font-family: 'Rouge Script', cursive !important;
            text-transform: none !important;
            letter-spacing: normal !important;
        }
    </style>
</head>
<body class="main-body">

    <!-- FIXED BACKGROUND LAYERS (Dual-layer for smooth crossfading) -->
    <div class="fixed-bg-window">
        <div id="bg-back" class="bg-layer" style="background-image: url('../../../assets/ui/backgrounds/sands-of-time-2.png');"></div>
        <div id="bg-front" class="bg-layer" style="background-image: url('../../../assets/ui/backgrounds/safe-keeping-2.png'); opacity: 0; transition: opacity 2.5s ease-in-out;"></div>
    </div>
    
    <!-- EMOJI PARTICLE CONTAINER -->
    <div id="leaf-container"></div>

    <!-- Navigation Header -->
    <header class="glass-panel nav-header">
        <a href="../../../splash.html">
            <img src="../../../jack-aspen-harper-icon.png" alt="Jack Aspen Harper" class="nav-icon">
        </a>
        <nav class="hidden-menu">
            <a href="../../../about.html" class="nav-tab">Jack Harper</a>
            <a href="../../../vault/index.html" class="nav-tab">The Vault</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="content-area">
        
        <!-- BACK TO SPLASH BUTTON -->
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="../../../splash.html" class="nav-tab">&lt; BACK TO HOME</a>
        </div>

        <h1 class="hero-title" style="margin-top: 0; font-size: clamp(3rem, 6vw, 4.5rem); margin-bottom: 15px; text-align: center;">Autobiography</h1>
        
        <div class="resort-card" style="text-align: center; padding: 15px; border-top: 3px solid var(--tiger-orange); margin-bottom: 30px;">
            <p style="margin: 0; font-family: 'Short Stack', cursive; font-size: 1.2rem; color: var(--tiger-orange); text-transform: uppercase; letter-spacing: 1px;">The Serialized Chapters</p>
            <p style="margin: 5px 0 0 0; font-family: 'Short Stack', cursive; font-size: 1.05rem; color: var(--text-primary);">A chapter-by-chapter release. Tap a chapter below to begin reading.</p>
        </div>

        <!-- THE CHAPTER LIST -->
        <div class="chapter-list">
            <!-- 
            ========================================================
            AUTOBIOGRAPHY CHAPTER BUTTON PLACEHOLDER
            Duplicate this button for each new chapter release.
            ========================================================
            -->
            <button class="chapter-btn" data-epub="chapters/intro.epub">Introduction</button>
            <button class="chapter-btn" data-epub="chapters/ch1.epub">Chapter 1</button>
            <button class="chapter-btn" data-epub="chapters/ch2.epub">Chapter 2</button>
            
            <!-- Example of how Chapter 2 will look: -->
            <!-- <button class="chapter-btn" data-epub="chapters/chapter-02.epub">Chapter 2</button> -->
        </div>
        
        <div style="height: 50px;"></div>
    </main>

    <!-- Footer -->
    <footer class="glass-panel main-footer">
        <img src="../../../jack-aspen-harper-icon.png" alt="Jack Aspen Harper" class="footer-logo">
        <p>&copy; 2026 Harperville</p>
        <p class="footer-subtext">Jack Aspen Harper</p>
    </footer>

    <!-- THE E-READER MODAL -->
    <div class="ereader-modal" id="ereader-modal">
        <div class="kindle-frame">
            <button class="close-reader" id="close-reader">X</button>
            <div id="viewer"></div>
            
            <div class="reader-controls">
                <button class="reader-btn" id="prev-page">&lt; PREV</button>
                <button class="reader-btn" id="next-page">NEXT &gt;</button>
            </div>
        </div>
    </div>

    <!-- THE AUTUMN ENGINE JS (Slideshow & Leaves) -->
    <script>
        // --- 1. THE AUTUMN SLIDESHOW ENGINE (Randomized with ../../../ paths) ---
        const bgImages = [
            '../../../assets/ui/backgrounds/sands-of-time-2.png',
            '../../../assets/ui/backgrounds/distance-between-him-1.png',
            '../../../assets/ui/backgrounds/safe-keeping-2.png',
            '../../../assets/ui/backgrounds/island-daddy-1.png',
            '../../../assets/ui/backgrounds/and-a-bag-of-chips.png',
            '../../../assets/ui/backgrounds/distance-between-him-2.png',
            '../../../assets/ui/backgrounds/sands-of-time-1.png',
            '../../../assets/ui/backgrounds/safe-keeping-1.png',
            '../../../assets/ui/backgrounds/island-daddy-2.png',
            '../../../assets/ui/backgrounds/sands-of-time-3.png'
        ];

        let currentBgIndex = 0;
        const layerBack = document.getElementById('bg-back');
        const layerFront = document.getElementById('bg-front');
        let isFrontActive = false;

        bgImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        setInterval(() => {
            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
            const nextImage = `url('${bgImages[currentBgIndex]}')`;

            if (isFrontActive) {
                layerBack.style.backgroundImage = nextImage;
                layerFront.style.opacity = '0';
            } else {
                layerFront.style.backgroundImage = nextImage;
                layerFront.style.opacity = '1';
            }
            isFrontActive = !isFrontActive;
            
        }, 14000); 

        // --- 2. EMOJI LEAF ENGINE ---
        const leaves = ['🍂', '🍁', '🤎', '🧡', '🌾']; 
        const containerLeaves = document.getElementById('leaf-container');
        for(let i = 0; i < 20; i++) { 
            let leaf = document.createElement('div');
            leaf.className = 'emoji-leaf';
            leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = (Math.random() * 6 + 6) + 's';
            leaf.style.animationDelay = (Math.random() * 5) + 's';
            leaf.style.fontSize = (Math.random() * 0.8 + 1.2) + 'rem';
            containerLeaves.appendChild(leaf);
        }
    </script>

    <!-- THE LOGIC ENGINE (ePub.js) -->
    <script>
        // --- ePub Reader Logic ---
        const modal = document.getElementById('ereader-modal');
        const closeBtn = document.getElementById('close-reader');
        const nextBtn = document.getElementById('next-page');
        const prevBtn = document.getElementById('prev-page');
        
        let currentBook = null;
        let rendition = null;

        document.querySelectorAll('.chapter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                openReader(this.getAttribute('data-epub'));
            });
        });

        function openReader(fileUrl) {
            modal.style.display = 'flex';
            document.getElementById("viewer").innerHTML = "";
            currentBook = ePub(fileUrl);
            
            rendition = currentBook.renderTo("viewer", {
                width: "100%", height: "100%", spread: "none", manager: "continuous", flow: "paginated"
            });
            
            // Re-themed the ePub output to match the Autumn aesthetic fonts and colors
            rendition.themes.default({
                "body": { "font-family": "Georgia, serif", "color": "#1C120C", "padding": "0 10px", "background": "#F4EFEB" }
            });
            rendition.display();
        }

        function closeReader() {
            modal.style.display = 'none';
            if (currentBook) {
                currentBook.destroy(); 
                currentBook = null;
            }
        }

        // --- Manual Navigation ---
        function manualTurn(direction) {
            if (rendition) {
                if (direction === 'next') rendition.next();
                if (direction === 'prev') rendition.prev();
            }
        }

        nextBtn.addEventListener('click', () => { manualTurn('next'); });
        prevBtn.addEventListener('click', () => { manualTurn('prev'); });

        // --- Keyboard Controls ---
        document.addEventListener('keyup', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowRight') manualTurn('next');
                if (e.key === 'ArrowLeft') manualTurn('prev');
                if (e.key === 'Escape') closeReader();
            }
        });

        closeBtn.addEventListener('click', () => { 
            closeReader();
        });
    </script>
</body>
</html>
